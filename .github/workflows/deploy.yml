# Constrói a imagem fora da VPS (o build passa de 1,7 GB de RAM e derrubava o
# servidor), publica no GHCR e avisa o Easypanel para baixar a imagem pronta.
name: Build e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # URL de deploy do serviço no Easypanel (aba Deployments), guardada como
      # secret EASYPANEL_DEPLOY_URL no repositório.
      - name: Avisar o Easypanel
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "::warning::EASYPANEL_DEPLOY_URL não configurado; imagem publicada, deploy não disparado."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$EASYPANEL_DEPLOY_URL"
